<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Profile</title>
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
    <main class="profile-page">
        <a href="/chat.html" class="back">← Back to chat</a>
        <section class="profile-card">
            <div class="avatar" id="avatar">?</div>
            <h1 id="profileUsername">Loading...</h1>
            <p id="profileEmail" class="muted"></p>
            <div class="profile-row"><span>Account</span><strong>Private Chat</strong></div>
            <div class="profile-row"><span>Created</span><strong id="profileCreated">—</strong></div>
            <button id="logoutBtn" class="danger-btn">Log out</button>
        </section>
    </main>
    <script src="/js/profile.js"></script>
</body>
</html>
